name: Desktop Builds

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: alloy
            artifact: alloy-linux-x86_64
          - name: Windows x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: alloy.exe
            artifact: alloy-windows-x86_64
          - name: macOS Intel
            os: macos-13
            target: x86_64-apple-darwin
            binary: alloy
            artifact: alloy-macos-x86_64
          - name: macOS Apple Silicon
            os: macos-14
            target: aarch64-apple-darwin
            binary: alloy
            artifact: alloy-macos-aarch64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux audio dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            crates/alloy-app
            crates/alloy-core

      - name: Build
        run: cargo build --release --bin alloy --target ${{ matrix.target }}

      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p "dist/${{ matrix.artifact }}"
          if [ "${{ runner.os }}" = "macOS" ]; then
            mkdir -p "dist/${{ matrix.artifact }}/Alloy.app/Contents/MacOS"
            mkdir -p "dist/${{ matrix.artifact }}/Alloy.app/Contents/Resources"
            cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "dist/${{ matrix.artifact }}/Alloy.app/Contents/MacOS/Alloy"
            chmod +x "dist/${{ matrix.artifact }}/Alloy.app/Contents/MacOS/Alloy"
            cat > "dist/${{ matrix.artifact }}/Alloy.app/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDevelopmentRegion</key>
            <string>en</string>
            <key>CFBundleDisplayName</key>
            <string>Alloy</string>
            <key>CFBundleExecutable</key>
            <string>Alloy</string>
            <key>CFBundleIdentifier</key>
            <string>dev.alloy.player</string>
            <key>CFBundleInfoDictionaryVersion</key>
            <string>6.0</string>
            <key>CFBundleName</key>
            <string>Alloy</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>0.1.0</string>
            <key>CFBundleVersion</key>
            <string>${{ github.run_number }}</string>
            <key>LSApplicationCategoryType</key>
            <string>public.app-category.music</string>
            <key>NSHighResolutionCapable</key>
            <true/>
          </dict>
          </plist>
          PLIST
          else
            cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "dist/${{ matrix.artifact }}/"
          fi
          cp README.md "dist/${{ matrix.artifact }}/"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
